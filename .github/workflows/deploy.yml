name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REGISTRY_HOST: registry.marquesfernandes.com
      IMAGE_NAME: marquesfernandes/site
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Fast gates before the (slower) image build.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:types
      - run: pnpm test

      - uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=min
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:latest

      # Tell Dokploy to pull the new :latest image and redeploy.
      - name: Trigger Dokploy deploy
        run: |
          STATUS=$(curl -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}" -w "%{http_code}" -s -o /dev/null)
          echo "Dokploy webhook responded: $STATUS"
          if [ "${STATUS:0:1}" != "2" ]; then
            echo "Deploy trigger failed with status $STATUS"
            exit 1
          fi
