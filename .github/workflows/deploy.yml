name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Gate and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Quality gates — fail before triggering a deploy if anything is broken.
      - run: pnpm lint
      - run: pnpm check:types
      - run: pnpm test
      - run: pnpm build

      # Trigger Dokploy, which builds the Dockerfile on its own server and
      # deploys. The webhook URL embeds the app token (no registry/auth needed).
      - name: Trigger Dokploy deploy
        run: |
          STATUS=$(curl -X POST "${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}" -w "%{http_code}" -s -o /dev/null)
          echo "Dokploy webhook responded: $STATUS"
          if [ "${STATUS:0:1}" != "2" ]; then
            echo "Deploy trigger failed with status $STATUS"
            exit 1
          fi
