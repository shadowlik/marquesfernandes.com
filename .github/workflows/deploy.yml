name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.dockerignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      skip_build:
        description: 'Skip the image build — just trigger a Dokploy redeploy of the current image.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      REGISTRY_HOST: registry.marquesfernandes.com
      IMAGE_NAME: marquesfernandes/site
      IMAGE_TAG: ${{ github.sha }}
      SKIP_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_build == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Dokploy secrets
        run: |
          if [ -z "${{ secrets.DOKPLOY_AUTH_TOKEN }}" ] || [ -z "${{ secrets.DOKPLOY_SITE_APPLICATION_ID }}" ] || [ -z "${{ secrets.DOKPLOY_URL }}" ]; then
            echo "Dokploy secrets are missing!"
            exit 1
          fi

      - name: Set up Docker Buildx
        if: ${{ env.SKIP_BUILD != 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        if: ${{ env.SKIP_BUILD != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push image
        if: ${{ env.SKIP_BUILD != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=min
          tags: |
            ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY_HOST }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Dokploy
        run: |
          STATUS=$(curl -X POST \
            "${{ secrets.DOKPLOY_URL }}/api/application.deploy" \
            -H 'accept: application/json' \
            -H 'Content-Type: application/json' \
            -H "x-api-key: ${{ secrets.DOKPLOY_AUTH_TOKEN }}" \
            -d "{\"applicationId\": \"${{ secrets.DOKPLOY_SITE_APPLICATION_ID }}\"}" \
            -w "%{http_code}" -s -o /dev/null)
          echo "Dokploy responded: $STATUS"
          if [ "${STATUS:0:1}" != "2" ]; then
            echo "Deployment failed with status $STATUS"
            exit 1
          fi
