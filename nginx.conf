server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml application/rss+xml application/manifest+json;

    # Content-hashed assets never change — cache hard.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # New HAID article paths were published before the category-less URL
    # migration map reached nginx. Keep those incoming links as real 301s.
    location = /desenvolvimento/1-como-parei-de-construir-funcionalidades-aleatorias-e-encontrei-uma-direcao-de-produto/ {
        return 301 /1-como-parei-de-construir-funcionalidades-aleatorias-e-encontrei-uma-direcao-de-produto/;
    }

    location = /en/development/1-how-i-stopped-building-random-features-and-found-a-product-direction/ {
        return 301 /en/1-how-i-stopped-building-random-features-and-found-a-product-direction/;
    }

    location = /es/desarrollo/1-como-deje-de-crear-funcionalidades-al-azar-y-encontre-una-direccion-de-producto/ {
        return 301 /es/1-como-deje-de-crear-funcionalidades-al-azar-y-encontre-una-direccion-de-producto/;
    }

    # Canonicalize: 301 any extensionless path missing its trailing slash
    # (e.g. /blog -> /blog/). Files like /rss.xml or /_astro/x.webp are skipped.
    rewrite ^([^.?]*[^/])$ $1/ permanent;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
